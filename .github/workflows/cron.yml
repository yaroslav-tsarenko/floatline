name: Cron tick

# Free real-cadence scheduler for the Vercel Hobby plan. Vercel Hobby allows
# only one cron/day, so vercel.json runs /api/cron/tick daily as a backstop and
# this workflow pings the same endpoint every ~5 minutes. The tick endpoint
# itself decides which jobs are actually due (see app/api/cron/tick/route.ts),
# so scheduling logic stays inside the app.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CRON_TICK_URL  e.g. https://csfloatline.com/api/cron/tick
#   CRON_SECRET    same value as the app's CRON_SECRET env var

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping cron tick
        run: |
          code=$(curl -sS --max-time 300 -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.CRON_TICK_URL }}")
          echo "tick responded: $code"
          test "$code" = "200"
